        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InteractionResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Interaction
      summary: Clear the current user's favorite for a video
      description: 配置异步管道时，API 更新 Redis 并发布互动消息，由独立 worker 幂等落库；worker 暂停时消息积压。同步回退行为及响应格式保持不变。
      operationId: clearVideoFavorite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InteractionIdempotencyKey'
      responses:
        '200':
          description: Inactive favorite state and interaction counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
