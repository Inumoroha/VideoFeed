openapi: 3.0.3
info:
  title: Video Feed API
  version: 1.0.0
servers:
  - url: /
    description: Current API server
paths:
  /health:
    get:
      tags:
        - Health
      summary: Get service health status
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
  /api/users:
    post:
      tags:
        - User
      summary: Register a user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              account: demo_user
              password: example-password
              nickname: Demo User
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Demo User
                role: user
                bio: ""
                status: 1
                avatar_url: ""
                following_count: 0
                follower_count: 0
                work_count: 0
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: Account already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: account already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/sessions:
    post:
      tags:
        - Authentication
      summary: Log in with account and password
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              account: demo_user
              password: example-password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: example-access-token
                token_type: Bearer
                expires_in_seconds: 900
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid credentials
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/sessions/current:
    delete:
      tags:
        - Authentication
      summary: Log out the current user
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful; the client must discard the access token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me:
    get:
      tags:
        - User
      summary: Get the current user profile
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Demo User
                role: user
                bio: ""
                status: 1
                avatar_url: ""
                following_count: 0
                follower_count: 0
                work_count: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - User
      summary: Update the current user profile
      operationId: updateCurrentUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              nickname: Updated User
              bio: Updated profile
              avatar_url: https://example.com/avatar.png
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Updated User
                role: user
                bio: Updated profile
                status: 1
                avatar_url: https://example.com/avatar.png
                following_count: 0
                follower_count: 0
                work_count: 3
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/{userId}:
    get:
      tags:
        - User
      summary: Get a public user profile
      operationId: getUserProfile
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 42
      responses:
        '200':
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfileResponse'
              example:
                id: 42
                nickname: Demo User
                bio: Video creator
                avatar_url: https://example.com/avatar.png
                following_count: 12
                follower_count: 34
                work_count: 8
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos:
    post:
      tags:
        - Video
      summary: Create a published video
      operationId: createVideo
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: Optional key used to safely retry the same create request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoRequest'
            example:
              title: Demo video
              media_url: https://example.com/video.mp4
              cover_url: https://example.com/cover.jpg
      responses:
        '201':
          description: Video created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '200':
          description: Existing video returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/{videoId}:
    parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Video
      summary: Get a published video
      operationId: getVideo
      security: []
      responses:
        '200':
          description: Published video details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Video
      summary: Delete a video owned by the current user
      operationId: deleteVideo
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Video deleted
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/VideoPermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/{userId}/videos:
    get:
      tags:
        - Video
      summary: List published videos by author
      operationId: listVideosByAuthor
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/VideoLimit'
        - $ref: '#/components/parameters/VideoOffset'
      responses:
        '200':
          description: Published videos by the author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me/videos:
    get:
      tags:
        - Video
      summary: List the current user's published videos
      operationId: listMyVideos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoLimit'
        - $ref: '#/components/parameters/VideoOffset'
      responses:
        '200':
          description: Current user's published videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/feed-items:
    get:
      tags:
        - Feed
      summary: 获取时间线、热榜或关注流
      operationId: getTimelineFeed
      description: >-
        scene 默认 timeline，支持 timeline、hot、following，参数会去除首尾空白并转为小写。
        following 必须提供有效的 Bearer 访问令牌；未提供或无效令牌按匿名处理并返回 401。
        following 使用异步分发索引，发布后可能短暂延迟；索引缺失、不足或故障时回源数据库。
        其他场景可匿名访问。关注流按发布时间和视频 ID 倒序排列，合并收件箱与大作者拉取结果。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeedScene'
        - $ref: '#/components/parameters/FeedLimit'
        - $ref: '#/components/parameters/FeedCursor'
      responses:
        '200':
          description: 信息流分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          $ref: '#/components/responses/InvalidFeedRequest'
        '401':
          description: 关注流缺少有效登录身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: viewer is required
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/feed/query:
    post:
      tags:
        - Feed
      summary: Query a feed scene with contextual parameters
      operationId: queryFeed
      description: >-
        scene 默认 timeline，支持 timeline、hot、following，参数会去除首尾空白并转为小写。
        following 必须提供有效的 Bearer 访问令牌；未提供或无效令牌按匿名处理并返回 401。
        following 使用异步分发索引，发布后可能短暂延迟；索引缺失、不足或故障时回源数据库。
        其他场景可匿名访问。关注流按发布时间和视频 ID 倒序排列，合并收件箱与大作者拉取结果。
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedQueryRequest'
            example:
              scene: following
              limit: 10
      responses:
        '200':
          description: Feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          $ref: '#/components/responses/InvalidFeedRequest'
        '401':
          description: 关注流缺少有效登录身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: viewer is required
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/{videoId}/like:
    parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags:
        - Interaction
      summary: Set the current user's like for a video
      operationId: setVideoLike
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InteractionIdempotencyKey'
      responses:
        '200':
          description: Active like state and interaction counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InteractionResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Interaction
      summary: Clear the current user's like for a video
      operationId: clearVideoLike
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InteractionIdempotencyKey'
      responses:
        '200':
          description: Inactive like state and interaction counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InteractionResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/{videoId}/favorite:
    parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags:
        - Interaction
      summary: Set the current user's favorite for a video
      operationId: setVideoFavorite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InteractionIdempotencyKey'
      responses:
        '200':
          description: Active favorite state and interaction counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InteractionResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Interaction
      summary: Clear the current user's favorite for a video
      operationId: clearVideoFavorite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InteractionIdempotencyKey'
      responses:
        '200':
          description: Inactive favorite state and interaction counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InteractionResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/{videoId}/comments:
    parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Interaction
      summary: List comments for a video
      operationId: listVideoComments
      security: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: URL-safe Base64 cursor returned by the previous page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Comment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Interaction
      summary: Create a comment for a video
      operationId: createVideoComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCommentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InteractionResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      tags:
        - Interaction
      summary: Delete a comment owned by the current user or an administrator
      operationId: deleteVideoComment
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCommentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The current user cannot delete this comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: comment permission denied
        '404':
          $ref: '#/components/responses/CommentNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/uploads:
    post:
      tags:
        - Upload
      summary: Upload a file
      operationId: uploadFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional key used to safely retry the same request.
    InteractionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional key that returns the first action state and counter snapshot when a like or favorite request is retried.
    VideoLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
      description: Number of items to return; values above 100 are capped at 100.
    VideoOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    FeedScene:
      name: scene
      in: query
      required: false
      schema:
        type: string
        default: timeline
      description: 支持 timeline、hot、following；空值使用 timeline；忽略大小写及首尾空白，其他值返回 400；following 要求有效访问令牌。
      example: following
    FeedLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 10
      description: Number of feed items to return; values above 100 are capped at 100.
    FeedCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: URL-safe Base64 cursor returned by the previous feed page. Timeline and following cursors contain publication time and video ID; hot cursors depend on the active ranking strategy. Invalid cursors return 400.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: healthy
    RegisterRequest:
      type: object
      required:
        - account
        - password
        - nickname
      properties:
        account:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        password:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        nickname:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        password:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in_seconds
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in_seconds:
          type: integer
          format: int64
          example: 900
    UserProfileResponse:
      type: object
      required:
        - id
        - account
        - nickname
        - role
        - bio
        - status
        - avatar_url
        - following_count
        - follower_count
        - work_count
      properties:
        id:
          type: integer
          format: int64
          example: 1
        account:
          type: string
          example: demo_user
        nickname:
          type: string
          example: Demo User
        role:
          type: string
          example: user
        bio:
          type: string
          example: ""
        status:
          type: integer
          example: 1
        avatar_url:
          type: string
          example: ""
        following_count:
          type: integer
          minimum: 0
          example: 0
        follower_count:
          type: integer
          minimum: 0
          example: 0
        work_count:
          type: integer
          minimum: 0
          example: 3
    PublicUserProfileResponse:
      type: object
      required:
        - id
        - nickname
        - bio
        - avatar_url
        - following_count
        - follower_count
        - work_count
      properties:
        id:
          type: integer
          format: int64
          example: 42
        nickname:
          type: string
          example: Demo User
        bio:
          type: string
          example: Video creator
        avatar_url:
          type: string
          example: https://example.com/avatar.png
        following_count:
          type: integer
          minimum: 0
          example: 12
        follower_count:
          type: integer
          minimum: 0
          example: 34
        work_count:
          type: integer
          minimum: 0
          example: 8
    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        avatar_url:
          type: string
        bio:
          type: string
    CreateVideoRequest:
      type: object
      required:
        - title
        - media_url
        - cover_url
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '.*\S.*'
        description:
          type: string
          maxLength: 512
        media_url:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        cover_url:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    VideoResponse:
      type: object
      required:
        - id
        - author_id
        - title
        - description
        - media_url
        - cover_url
        - status
        - like_count
        - comment_count
        - favorite_count
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        author_id:
          type: integer
          format: int64
          example: 7
        title:
          type: string
          example: Demo video
        description:
          type: string
          maxLength: 512
          example: A short introduction to the video.
        media_url:
          type: string
          example: https://example.com/video.mp4
        cover_url:
          type: string
          example: https://example.com/cover.jpg
        status:
          type: integer
          example: 2
        like_count:
          type: integer
          example: 0
        comment_count:
          type: integer
          example: 0
        favorite_count:
          type: integer
          example: 0
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 1
        author_id: 7
        title: Demo video
        description: A short introduction to the video.
        media_url: https://example.com/video.mp4
        cover_url: https://example.com/cover.jpg
        status: 2
        like_count: 0
        comment_count: 0
        favorite_count: 0
        published_at: '2026-08-30T12:00:00Z'
        created_at: '2026-08-30T12:00:00Z'
        updated_at: '2026-08-30T12:00:00Z'
    VideoListResponse:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoResponse'
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
      example:
        items: []
        limit: 20
        offset: 0
    FeedQueryRequest:
      type: object
      properties:
        scene:
          type: string
          description: 支持 timeline、hot、following；省略或空值使用 timeline，忽略大小写及首尾空白；following 要求有效访问令牌。
        cursor:
          type: string
        limit:
          type: integer
          minimum: 1
          description: 大于 100 时截断为 100；省略时默认 10。
          default: 10
        context:
          type: object
          additionalProperties:
            type: string
    FeedResponse:
      type: object
      required:
        - scene
        - items
        - next_cursor
        - has_more
      properties:
        scene:
          type: string
          example: timeline
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItemResponse'
        next_cursor:
          type: string
          description: URL 安全的 Base64 游标；关注流非空页始终返回游标，包括最后一页。是否继续应以 has_more 为准。
        has_more:
          type: boolean
      example:
        scene: following
        items: []
        next_cursor: ""
        has_more: false
    FeedItemResponse:
      type: object
      required:
        - video_id
        - author_id
        - author_nickname
        - author_avatar_url
        - title
        - description
        - media_url
        - cover_url
        - like_count
        - comment_count
        - favorite_count
        - published_at
      properties:
        video_id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        author_nickname:
          type: string
        author_avatar_url:
          type: string
        title:
          type: string
        description:
          type: string
        media_url:
          type: string
        cover_url:
          type: string
        like_count:
          type: integer
        comment_count:
          type: integer
        favorite_count:
          type: integer
        published_at:
          type: string
          format: date-time
    ActionResponse:
      type: object
      required:
        - video_id
        - action_type
        - active
        - like_count
        - favorite_count
      properties:
        video_id:
          type: integer
          format: int64
        action_type:
          type: string
          enum:
            - LIKE
            - FAVORITE
        active:
          type: boolean
        like_count:
          type: integer
          minimum: 0
        favorite_count:
          type: integer
          minimum: 0
    CreateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '.*\S.*'
    CommentResponse:
      type: object
      required:
        - id
        - video_id
        - user_id
        - user_nickname
        - user_avatar_url
        - content
        - created_at
      properties:
        id:
          type: integer
          format: int64
        video_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        user_nickname:
          type: string
        user_avatar_url:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
    CreateCommentResponse:
      allOf:
        - $ref: '#/components/schemas/CommentResponse'
        - type: object
          required:
            - comment_count
          properties:
            comment_count:
              type: integer
              minimum: 0
    CommentListResponse:
      type: object
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponse'
        next_cursor:
          type: string
        has_more:
          type: boolean
    DeleteCommentResponse:
      type: object
      required:
        - comment_id
        - status
        - comment_count
      properties:
        comment_id:
          type: integer
          format: int64
        status:
          type: integer
        comment_count:
          type: integer
          minimum: 0
    UploadRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
        kind:
          type: string
          enum:
            - video
            - cover
            - avatar
            - file
          default: file
    UploadResponse:
      type: object
      required:
        - url
        - kind
        - filename
        - size
      properties:
        url:
          type: string
        kind:
          type: string
          enum:
            - video
            - cover
            - avatar
            - file
        filename:
          type: string
        size:
          type: integer
          format: int64
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    InvalidFeedRequest:
      description: 分页数量、游标、场景或 JSON 请求体无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: cursor is invalid
    InvalidRequest:
      description: Invalid request body or input fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid request
    PayloadTooLarge:
      description: Uploaded file exceeds the size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: upload too large
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal server error
    Unauthorized:
      description: Authentication is required or the access token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid access token
    UserNotFound:
      description: User was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: user not found
    VideoNotFound:
      description: Video was not found or is not published
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: video not found
    InteractionResourceNotFound:
      description: The requested interaction resource was not found or is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: resource not found
    VideoPermissionDenied:
      description: The current user does not own the video
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: video permission denied
    CommentNotFound:
      description: Comment was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: resource not found
