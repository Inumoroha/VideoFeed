        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/{videoId}/comments:
    parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Interaction
      summary: List comments for a video
      operationId: listVideoComments
      security: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: URL-safe Base64 cursor returned by the previous page.
        - name: limit
          in: query
