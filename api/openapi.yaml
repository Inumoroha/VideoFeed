openapi: 3.0.3
info:
  title: Video Feed API
  version: 1.0.0
paths:
  /health:
    get:
      tags:
        - Health
      summary: Get service health status
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              account: demo_user
              password: example-password
              nickname: Demo User
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Demo User
                role: user
                bio: ""
                status: 1
                avatar_url: ""
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: Account already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: account already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/login/password:
    post:
      tags:
        - Authentication
      summary: Log in with account and password
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              account: demo_user
              password: example-password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: example-access-token
                token_type: Bearer
                expires_in_seconds: 900
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid credentials
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out the current user
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful; the client must discard the access token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me:
    get:
      tags:
        - User
      summary: Get the current user profile
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Demo User
                role: user
                bio: ""
                status: 1
                avatar_url: ""
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - User
      summary: Update the current user profile
      operationId: updateCurrentUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              nickname: Updated User
              bio: Updated profile
              avatar_url: https://example.com/avatar.png
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos:
    post:
      tags:
        - Video
      summary: Create a published video
      operationId: createVideo
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: Optional key used to safely retry the same create request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoRequest'
            example:
              title: Demo video
              media_url: https://example.com/video.mp4
              cover_url: https://example.com/cover.jpg
      responses:
        '201':
          description: Video created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '200':
          description: Existing video returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/{videoId}:
    parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Video
      summary: Get a published video
      operationId: getVideo
      security: []
      responses:
        '200':
          description: Published video details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Video
      summary: Delete a video owned by the current user
      operationId: deleteVideo
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Video deleted
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/VideoPermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/{userId}/videos:
    get:
      tags:
        - Video
      summary: List published videos by author
      operationId: listVideosByAuthor
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/VideoLimit'
        - $ref: '#/components/parameters/VideoOffset'
      responses:
        '200':
          description: Published videos by the author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/mine:
    get:
      tags:
        - Video
      summary: List the current user's published videos
      operationId: listMyVideos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoLimit'
        - $ref: '#/components/parameters/VideoOffset'
      responses:
        '200':
          description: Current user's published videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/feed/timeline:
    get:
      tags:
        - Feed
      summary: Get the chronological video feed
      operationId: getTimelineFeed
      security: []
      parameters:
        - $ref: '#/components/parameters/FeedLimit'
        - $ref: '#/components/parameters/FeedCursor'
      responses:
        '200':
          description: Chronological feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/feed/refresh:
    get:
      tags:
        - Feed
      summary: Refresh the chronological video feed
      operationId: refreshTimelineFeed
      security: []
      parameters:
        - $ref: '#/components/parameters/FeedLimit'
      responses:
        '200':
          description: Refreshed feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/interactions/like:
    post:
      tags:
        - Interaction
      summary: Toggle the current user's like for a video
      operationId: toggleVideoLike
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleActionRequest'
      responses:
        '200':
          description: Updated like state and interaction counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/interactions/favorite:
    post:
      tags:
        - Interaction
      summary: Toggle the current user's favorite for a video
      operationId: toggleVideoFavorite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleActionRequest'
      responses:
        '200':
          description: Updated favorite state and interaction counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToggleActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/comments:
    get:
      tags:
        - Interaction
      summary: List comments for a video
      operationId: listVideoComments
      security: []
      parameters:
        - name: video_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: URL-safe Base64 cursor returned by the previous page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Comment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Interaction
      summary: Create a comment for a video
      operationId: createVideoComment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCommentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      tags:
        - Interaction
      summary: Delete a comment owned by the current user or an administrator
      operationId: deleteVideoComment
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCommentResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The current user cannot delete this comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: comment permission denied
        '404':
          $ref: '#/components/responses/CommentNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/uploads:
    post:
      tags:
        - Upload
      summary: Upload a file
      operationId: uploadFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional key used to safely retry the same request.
    VideoLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
      description: Number of items to return; values above 100 are capped at 100.
    VideoOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    FeedLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
      description: Number of feed items to return; values above 100 are capped at 100.
    FeedCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: URL-safe Base64 cursor returned by the previous feed page. It contains the last item's publication time and video ID; invalid cursors return 400.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: healthy
    RegisterRequest:
      type: object
      required:
        - account
        - password
        - nickname
      properties:
        account:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        password:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        nickname:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        password:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in_seconds
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in_seconds:
          type: integer
          format: int64
          example: 900
    UserProfileResponse:
      type: object
      required:
        - id
        - account
        - nickname
        - role
        - bio
        - status
        - avatar_url
      properties:
        id:
          type: integer
          format: int64
          example: 1
        account:
          type: string
          example: demo_user
        nickname:
          type: string
          example: Demo User
        role:
          type: string
          example: user
        bio:
          type: string
          example: ""
        status:
          type: integer
          example: 1
        avatar_url:
          type: string
          example: ""
    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        avatar_url:
          type: string
        bio:
          type: string
    CreateVideoRequest:
      type: object
      required:
        - title
        - media_url
        - cover_url
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '.*\S.*'
        description:
          type: string
          maxLength: 512
        media_url:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        cover_url:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    VideoResponse:
      type: object
      required:
        - id
        - author_id
        - title
        - description
        - media_url
        - cover_url
        - status
        - like_count
        - comment_count
        - favorite_count
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        author_id:
          type: integer
          format: int64
          example: 7
        title:
          type: string
          example: Demo video
        description:
          type: string
          maxLength: 512
          example: A short introduction to the video.
        media_url:
          type: string
          example: https://example.com/video.mp4
        cover_url:
          type: string
          example: https://example.com/cover.jpg
        status:
          type: integer
          example: 2
        like_count:
          type: integer
          example: 0
        comment_count:
          type: integer
          example: 0
        favorite_count:
          type: integer
          example: 0
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 1
        author_id: 7
        title: Demo video
        description: A short introduction to the video.
        media_url: https://example.com/video.mp4
        cover_url: https://example.com/cover.jpg
        status: 2
        like_count: 0
        comment_count: 0
        favorite_count: 0
        published_at: '2026-08-30T12:00:00Z'
        created_at: '2026-08-30T12:00:00Z'
        updated_at: '2026-08-30T12:00:00Z'
    VideoListResponse:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoResponse'
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
      example:
        items: []
        limit: 20
        offset: 0
    FeedResponse:
      type: object
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItemResponse'
        next_cursor:
          type: string
          description: URL-safe Base64 cursor for the next page; it is empty when there is no next page.
        has_more:
          type: boolean
      example:
        items: []
        next_cursor: ""
        has_more: false
    FeedItemResponse:
      type: object
      required:
        - video_id
        - author_id
        - author_nickname
        - author_avatar_url
        - title
        - description
        - media_url
        - cover_url
        - like_count
        - comment_count
        - favorite_count
        - published_at
      properties:
        video_id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        author_nickname:
          type: string
        author_avatar_url:
          type: string
        title:
          type: string
        description:
          type: string
        media_url:
          type: string
        cover_url:
          type: string
        like_count:
          type: integer
        comment_count:
          type: integer
        favorite_count:
          type: integer
        published_at:
          type: string
          format: date-time
    ToggleActionRequest:
      type: object
      required:
        - video_id
      properties:
        video_id:
          type: integer
          format: int64
          minimum: 1
    ToggleActionResponse:
      type: object
      required:
        - video_id
        - action_type
        - active
        - like_count
        - favorite_count
      properties:
        video_id:
          type: integer
          format: int64
        action_type:
          type: string
          enum:
            - LIKE
            - FAVORITE
        active:
          type: boolean
        like_count:
          type: integer
          minimum: 0
        favorite_count:
          type: integer
          minimum: 0
    CreateCommentRequest:
      type: object
      required:
        - video_id
        - content
      properties:
        video_id:
          type: integer
          format: int64
          minimum: 1
        content:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '.*\S.*'
    CommentResponse:
      type: object
      required:
        - id
        - video_id
        - user_id
        - user_nickname
        - user_avatar_url
        - content
        - created_at
      properties:
        id:
          type: integer
          format: int64
        video_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        user_nickname:
          type: string
        user_avatar_url:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
    CreateCommentResponse:
      allOf:
        - $ref: '#/components/schemas/CommentResponse'
        - type: object
          required:
            - comment_count
          properties:
            comment_count:
              type: integer
              minimum: 0
    CommentListResponse:
      type: object
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponse'
        next_cursor:
          type: string
        has_more:
          type: boolean
    DeleteCommentResponse:
      type: object
      required:
        - comment_id
        - status
        - comment_count
      properties:
        comment_id:
          type: integer
          format: int64
        status:
          type: integer
        comment_count:
          type: integer
          minimum: 0
    UploadRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
        kind:
          type: string
          enum:
            - video
            - cover
            - avatar
            - file
          default: file
    UploadResponse:
      type: object
      required:
        - url
        - kind
        - filename
        - size
      properties:
        url:
          type: string
        kind:
          type: string
          enum:
            - video
            - cover
            - avatar
            - file
        filename:
          type: string
        size:
          type: integer
          format: int64
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    InvalidRequest:
      description: Invalid request body or input fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid request
    PayloadTooLarge:
      description: Uploaded file exceeds the size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: upload too large
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
