openapi: 3.0.3
info:
  title: Video Feed API
  version: 1.0.0
paths:
  /health:
    get:
      tags:
        - Health
      summary: Get service health status
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              account: demo_user
              password: example-password
              nickname: Demo User
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Demo User
                role: user
                bio: ""
                status: 1
                avatar_url: ""
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: Account already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: account already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/login/password:
    post:
      tags:
        - Authentication
      summary: Log in with account and password
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              account: demo_user
              password: example-password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: example-access-token
                token_type: Bearer
                expires_in_seconds: 900
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid credentials
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out the current user
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful; the client must discard the access token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me:
    get:
      tags:
        - User
      summary: Get the current user profile
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Demo User
                role: user
                bio: ""
                status: 1
                avatar_url: ""
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - User
      summary: Update the current user profile
      operationId: updateCurrentUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              nickname: Updated User
              bio: Updated profile
              avatar_url: https://example.com/avatar.png
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: healthy
    RegisterRequest:
      type: object
      required:
        - account
        - password
        - nickname
      properties:
        account:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        password:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        nickname:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        password:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in_seconds
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in_seconds:
          type: integer
          format: int64
          example: 900
    UserProfileResponse:
      type: object
      required:
        - id
        - account
        - nickname
        - role
        - bio
        - status
        - avatar_url
      properties:
        id:
          type: integer
          format: int64
          example: 1
        account:
          type: string
          example: demo_user
        nickname:
          type: string
          example: Demo User
        role:
          type: string
          example: user
        bio:
          type: string
          example: ""
        status:
          type: integer
          example: 1
        avatar_url:
          type: string
          example: ""
    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        avatar_url:
          type: string
        bio:
          type: string
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    InvalidRequest:
      description: Invalid request body or input fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid request
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal server error
    Unauthorized:
      description: Authentication is required or the access token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid access token
    UserNotFound:
      description: User was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: user not found
