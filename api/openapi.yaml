openapi: 3.0.3
info:
  title: Video Feed API
  version: 1.0.0
servers:
  - url: /
    description: Current API server
paths:
  /api/relations/{targetUserId}:
    put:
      tags:
      - Relation
      summary: 关注用户并回填小作者作品
      operationId: followRelationUser
      description: 用户身份来自 JWT，无请求体。配置 Redis 后，在关注已保存且返回有效关注状态时，同步回填粉丝数不足 10000 的作者最近最多
        100 条已发布作品，收件箱最多保留 1000 条。回填失败返回 500，已保存的关注和部分缓存写入不回滚；可使用原幂等键重试，重试仍执行回填。大作者或未配置
        Redis 时不回填。
      security:
      - bearerAuth: []
      parameters:
      - name: targetUserId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        description: 目标用户 ID，不能等于当前用户。
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: 去除首尾空白后最多 128 个 UTF-8 字节。复用现有关系幂等快照，回填会再次执行。
      responses:
        '200':
          description: 关注成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowResult'
              example:
                user_id: 42
                target_user_id: 77
                status: 1
                following: true
                following_count: 3
                follower_count: 4
        '400':
          description: 路径参数、自关注或幂等键校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid target user id
        '401':
          description: 缺少或无效访问令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid access token
        '404':
          description: 当前用户或目标用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: target user not found
        '500':
          description: 关系保存或回填失败；回填失败时已保存的关系不会撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error
  /api/users/me/following/{targetUserId}:
    put:
      tags:
      - Relation
      summary: 关注用户并回填小作者作品
      operationId: followUser
      description: 用户身份来自 JWT，无请求体。配置 Redis 后，在关注已保存且返回有效关注状态时，同步回填粉丝数不足 10000 的作者最近最多
        100 条已发布作品，收件箱最多保留 1000 条。回填失败返回 500，已保存的关注和部分缓存写入不回滚；可使用原幂等键重试，重试仍执行回填。大作者或未配置
        Redis 时不回填。
      security:
      - bearerAuth: []
      parameters:
      - name: targetUserId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        description: 目标用户 ID，不能等于当前用户。
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: 去除首尾空白后最多 128 个 UTF-8 字节。复用现有关系幂等快照，回填会再次执行。
      responses:
        '200':
          description: 关注成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowResult'
              example:
                user_id: 42
                target_user_id: 77
                status: 1
                following: true
                following_count: 3
                follower_count: 4
        '400':
          description: 路径参数、自关注或幂等键校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid target user id
        '401':
          description: 缺少或无效访问令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid access token
        '404':
          description: 当前用户或目标用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: target user not found
        '500':
          description: 关系保存或回填失败；回填失败时已保存的关系不会撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error
  /internal/recommendation-candidates:
    post:
      tags:
      - Recommendation
      summary: 查询推荐候选
      operationId: listRecommendationCandidates
      description: 按热度召回已发布且近七天未曝光的视频，以近三十天最多二百条正向观看事件构建画像；兴趣、热度、新鲜度排序并在页内打散作者，无画像时使用冷启动权重。
        接口不使用 JWT，用户来自请求体。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationCandidateRequest'
            example:
              user_id: 42
              scene: recommend
              request_id: req-demo
              limit: 10
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationCandidateResponse'
              example:
                user_id: 42
                scene: recommend
                request_id: req-demo
                candidates:
                - video_id: 1001
                  author_id: 10
                  rank_score: 0.8
                  similarity: 1
                  hot_score: 0
                  freshness_score: 1
                  reason: interest_match
                  published_at: '2026-05-19T12:00:00Z'
                next_cursor: eyJyYW5rX3Njb3JlIjowLjgsInB1Ymxpc2hlZF9hdCI6IjIwMjYtMDUtMTlUMTI6MDA6MDBaIiwidmlkZW9faWQiOjEwMDF9
                has_more: false
        '400':
          description: JSON 绑定或领域参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid request
        '500':
          description: 数据库或服务处理失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error
  /internal/exposure-decisions:
    post:
      tags:
      - Recommendation
      summary: 查询视频曝光决策
      operationId: decideRecommendationExposures
      description: 只读查询指定用户近七天（含边界）的曝光；按视频首次出现顺序去重。scene 和 request_id 不参与曝光过滤。无记录的视频（包括不存在的视频）允许曝光，不检查视频发布状态。不写入曝光或预占名额，并发查询可同时允许同一视频。无自动重试或失败放行。接口不使用
        JWT，用户来自请求体。时间窗口沿用推荐服务默认按分钟截断的时钟。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationExposureDecisionsRequest'
            example:
              user_id: 42
              scene: recommend
              request_id: req-demo
              video_ids:
              - 1001
              - 1002
              - 1002
      responses:
        '200':
          description: '返回去重后的有序曝光决策；空列表返回 decisions: []'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationExposureDecisionsResponse'
              example:
                user_id: 42
                scene: recommend
                request_id: req-demo
                decisions:
                - video_id: 1001
                  allowed: false
                  reason: recently_exposed
                  last_exposed_at: '2026-09-20T12:00:00Z'
                - video_id: 1002
                  allowed: true
                  reason: fresh
        '400':
          description: JSON 绑定或参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid request
        '500':
          description: 曝光读取失败，不返回放行决策
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error
  /internal/exposures:
    post:
      tags:
      - Recommendation
      summary: 批量记录推荐曝光
      operationId: saveRecommendationExposures
      description: 同一批次按视频去重；事务中追加 exposed 流水并按用户和视频原子累加曝光；跨请求包括相同 request_id 均继续累加，任何写入失败回滚整个批次。不发布
        RabbitMQ 消息。 接口不使用 JWT，用户来自请求体。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationExposuresRequest'
            example:
              user_id: 42
              scene: recommend
              request_id: req-demo
              video_ids:
              - 1001
      responses:
        '201':
          description: 曝光已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationExposuresResponse'
              example:
                exposures:
                - user_id: 42
                  video_id: 1001
                  first_exposed_at: '2026-05-19T12:00:00Z'
                  last_exposed_at: '2026-05-19T12:00:00Z'
                  exposure_count: 1
                  last_scene: recommend
        '400':
          description: JSON 绑定或领域参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid request
        '500':
          description: 数据库或服务处理失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: internal server error
        '404':
          description: 视频不存在或未发布；整个批次回滚
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: video not found
  /api/video-view-events:
    post:
      tags:
      - Exposure
      summary: 上报曝光和观看事件
      operationId: createVideoViewEvent
      description: 用户身份来自 JWT；视频必须处于已发布状态。每次请求追加流水，exposed 在同一事务中原子累加曝光。request_id 不去重。数据库提交后尽力发布画像消息，消息失败不改变成功响应。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateViewEventRequest'
            example:
              video_id: 1001
              scene: timeline
              request_id: req-1
              event_type: exposed
              watch_ms: 0
              completed: false
      responses:
        '201':
          description: 行为已保存；曝光事件同时返回聚合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateViewEventResponse'
              examples:
                exposed:
                  value:
                    event:
                      id: 1
                      user_id: 42
                      video_id: 1001
                      scene: timeline
                      request_id: req-1
                      event_type: exposed
                      watch_ms: 0
                      completed: false
                      created_at: '2026-05-17T11:12:17Z'
                    exposure:
                      user_id: 42
                      video_id: 1001
                      first_exposed_at: '2026-05-17T11:12:17Z'
                      last_exposed_at: '2026-05-17T11:12:17Z'
                      exposure_count: 1
                      last_scene: timeline
                complete:
                  value:
                    event:
                      id: 2
                      user_id: 42
                      video_id: 1001
                      scene: timeline
                      request_id: req-1
                      event_type: complete
                      watch_ms: 12000
                      completed: true
                      created_at: '2026-05-17T11:12:17Z'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      tags:
        - Health
      summary: Get service health status
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
  /api/users:
    post:
      tags:
        - User
      summary: Register a user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              account: demo_user
              password: example-password
              nickname: Demo User
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Demo User
                role: user
                bio: ""
                status: 1
                avatar_url: ""
                following_count: 0
                follower_count: 0
                work_count: 0
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: Account already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: account already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/sessions:
    post:
      tags:
        - Authentication
      summary: Log in with account and password
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              account: demo_user
              password: example-password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: example-access-token
                token_type: Bearer
                expires_in_seconds: 900
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid credentials
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/sessions/current:
    delete:
      tags:
        - Authentication
      summary: Log out the current user
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful; the client must discard the access token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me:
    get:
      tags:
        - User
      summary: Get the current user profile
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Demo User
                role: user
                bio: ""
                status: 1
                avatar_url: ""
                following_count: 0
                follower_count: 0
                work_count: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - User
      summary: Update the current user profile
      operationId: updateCurrentUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              nickname: Updated User
              bio: Updated profile
              avatar_url: https://example.com/avatar.png
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Updated User
                role: user
                bio: Updated profile
                status: 1
                avatar_url: https://example.com/avatar.png
                following_count: 0
                follower_count: 0
                work_count: 3
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/{userId}:
    get:
      tags:
        - User
      summary: Get a public user profile
      operationId: getUserProfile
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 42
      responses:
        '200':
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfileResponse'
              example:
                id: 42
                nickname: Demo User
                bio: Video creator
                avatar_url: https://example.com/avatar.png
                following_count: 12
                follower_count: 34
                work_count: 8
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos:
    post:
      tags:
        - Video
      summary: Create a published video
      operationId: createVideo
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: Optional key used to safely retry the same create request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoRequest'
            example:
              title: Demo video
              media_url: https://example.com/video.mp4
              cover_url: https://example.com/cover.jpg
      responses:
        '201':
          description: Video created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '200':
          description: Existing video returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/{videoId}:
    parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Video
      summary: Get a published video
      operationId: getVideo
      security: []
      responses:
        '200':
          description: Published video details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Video
      summary: Delete a video owned by the current user
      operationId: deleteVideo
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Video deleted
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/VideoPermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/{userId}/videos:
    get:
      tags:
        - Video
      summary: List published videos by author
      operationId: listVideosByAuthor
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/VideoLimit'
        - $ref: '#/components/parameters/VideoOffset'
      responses:
        '200':
          description: Published videos by the author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me/videos:
    get:
      tags:
        - Video
      summary: List the current user's published videos
      operationId: listMyVideos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoLimit'
        - $ref: '#/components/parameters/VideoOffset'
      responses:
        '200':
          description: Current user's published videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/feed-items:
    get:
      tags:
        - Feed
      summary: 获取时间线、热榜、关注或推荐流
      operationId: getTimelineFeed
      description: >-
        scene 默认 timeline，支持 timeline、hot、following、recommend，参数会去除首尾空白并转为小写。
        following 和 recommend 必须提供有效的 Bearer 访问令牌；未提供或无效令牌按匿名处理并返回 401。
        following 使用独立 worker 消费发布事件生成异步分发索引，发布后可能短暂延迟；索引缺失、不足或故障时回源数据库。
        recommend 按兴趣、热度和新鲜度排序，过滤近期曝光并页内打散作者；不自动记录曝光。推荐领域的非法游标或过长 request_id 经现有 Feed 错误映射返回 500，内部推荐接口则返回 400。
        其他场景可匿名访问。关注流按发布时间和视频 ID 倒序排列，合并收件箱与大作者拉取结果。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FeedScene'
        - $ref: '#/components/parameters/FeedLimit'
        - $ref: '#/components/parameters/FeedCursor'
      responses:
        '200':
          description: 信息流分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          $ref: '#/components/responses/InvalidFeedRequest'
        '401':
          description: 关注流或推荐流缺少有效登录身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: viewer is required
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/feed/query:
    post:
      tags:
        - Feed
      summary: Query a feed scene with contextual parameters
      operationId: queryFeed
      description: >-
        scene 默认 timeline，支持 timeline、hot、following、recommend，参数会去除首尾空白并转为小写。
        following 和 recommend 必须提供有效的 Bearer 访问令牌；未提供或无效令牌按匿名处理并返回 401。
        following 使用独立 worker 消费发布事件生成异步分发索引，发布后可能短暂延迟；索引缺失、不足或故障时回源数据库。
        recommend 按兴趣、热度和新鲜度排序，过滤近期曝光并页内打散作者；不自动记录曝光。推荐领域的非法游标或过长 request_id 经现有 Feed 错误映射返回 500，内部推荐接口则返回 400。
        其他场景可匿名访问。关注流按发布时间和视频 ID 倒序排列，合并收件箱与大作者拉取结果。
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedQueryRequest'
            example:
              scene: following
              limit: 10
      responses:
        '200':
          description: Feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          $ref: '#/components/responses/InvalidFeedRequest'
        '401':
          description: 关注流或推荐流缺少有效登录身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: viewer is required
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/{videoId}/like:
    parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags:
        - Interaction
      summary: Set the current user's like for a video
      description: 配置异步管道时，API 更新 Redis 并发布互动消息，由独立 worker 幂等落库；worker 暂停时消息积压。同步回退行为及响应格式保持不变。
      operationId: setVideoLike
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InteractionIdempotencyKey'
      responses:
        '200':
          description: Active like state and interaction counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InteractionResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Interaction
      summary: Clear the current user's like for a video
      description: 配置异步管道时，API 更新 Redis 并发布互动消息，由独立 worker 幂等落库；worker 暂停时消息积压。同步回退行为及响应格式保持不变。
      operationId: clearVideoLike
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InteractionIdempotencyKey'
      responses:
        '200':
          description: Inactive like state and interaction counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InteractionResourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/{videoId}/favorite:
    parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags:
