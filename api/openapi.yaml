        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/uploads:
    post:
      tags:
        - Upload
      summary: Upload a file
      operationId: uploadFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional key used to safely retry the same request.
    InteractionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional key that returns the first action state and counter snapshot when a like or favorite request is retried.
    VideoLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
      description: Number of items to return; values above 100 are capped at 100.
    VideoOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    FeedScene:
      name: scene
      in: query
      required: false
      schema:
        type: string
        default: timeline
      description: 支持 timeline、hot、following、recommend；空值使用 timeline；忽略大小写及首尾空白，其他值返回 400；following 和 recommend 要求有效访问令牌。
      example: following
    FeedLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 10
      description: Number of feed items to return; values above 100 are capped at 100.
    FeedCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: URL-safe Base64 cursor returned by the previous feed page. Timeline and following cursors contain publication time and video ID; hot cursors depend on the active ranking strategy. Invalid timeline/hot/following cursors return 400; invalid recommendation cursors return 500 through the existing Feed error mapping.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RecommendationExposureDecisionsRequest:
      type: object
      required:
      - user_id
      - scene
      description: video_ids 缺省、null 或空数组时仍校验 user_id、scene、request_id；合法时返回空 decisions 且不访问数据库。无视频数量上限。
      properties:
        user_id: &exposureDecisionID
          type: integer
          format: int64
          minimum: 1
        scene:
          type: string
          description: 去除两端空白并转小写后必须非空，按 UTF-8 字节最多 32 字节；不限制场景枚举。
        request_id:
          type: string
          description: 可选，去除两端空白后最多 64 个 UTF-8 字节，不用于幂等或曝光过滤。
        video_ids:
          type: array
          nullable: true
          items: *exposureDecisionID
          description: 每个视频必须大于零，重复项按首次顺序去重。
    RecommendationExposureDecisionsResponse:
      type: object
      required:
      - user_id
      - scene
      - decisions
      properties:
        user_id: *exposureDecisionID
        scene:
          type: string
          description: 规范化后的场景。
        request_id:
          type: string
          description: 去除空白后的请求标识，为空时省略。
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationExposureDecision'
    RecommendationExposureDecision:
      type: object
      required:
      - video_id
      - allowed
      - reason
      properties:
        video_id: *exposureDecisionID
        allowed:
          type: boolean
        reason:
          type: string
          enum:
          - fresh
          - recently_exposed
        last_exposed_at:
          type: string
          format: date-time
          description: 仅近期曝光命中时返回；允许曝光时省略。
    FollowResult:
      type: object
      required:
      - user_id
      - target_user_id
      - status
      - following
      - following_count
      - follower_count
      properties:
        user_id:
          type: integer
          format: int64
        target_user_id:
          type: integer
          format: int64
        status:
          type: integer
          description: 1 为关注，2 为已取消；幂等重放返回首次结果。
        following:
          type: boolean
        following_count:
          type: integer
        follower_count:
          type: integer
    RecommendationCandidateRequest:
      type: object
      required:
      - user_id
      - scene
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
        scene:
          type: string
          description: 去除首尾空白并转小写后必须非空，UTF-8 字节长度最多 32；不限于 Feed 场景。
        request_id: &id002
          type: string
          description: 去除首尾空白后 UTF-8 字节长度最多 64；用于关联请求，不是幂等键。
        cursor:
          type: string
          description: 上一页 next_cursor；空值读取首页，接受 URL 安全无填充或标准 Base64。
        limit:
          type: integer
          nullable: true
          description: 省略、null 或非正数使用 10，大于 100 截为 100。
          default: 10
    RecommendationCandidate:
      type: object
      required:
      - video_id
      - author_id
      - rank_score
      - similarity
      - hot_score
      - freshness_score
      - reason
      - published_at
      properties:
        video_id: &id001
          type: integer
          format: int64
        author_id: *id001
        rank_score:
          type: number
          format: double
        similarity:
          type: number
          format: double
        hot_score:
          type: integer
        freshness_score:
          type: number
          format: double
        reason:
          type: string
          enum:
          - interest_match
          - hot
          - fresh
        published_at:
          type: string
          format: date-time
    RecommendationCandidateResponse:
      type: object
      required:
      - user_id
      - scene
      - candidates
      - next_cursor
      - has_more
      properties:
        user_id: *id001
        scene:
          type: string
        request_id:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationCandidate'
        next_cursor:
          type: string
        has_more:
          type: boolean
    RecommendationExposuresRequest:
      type: object
      description: video_ids 缺省、null 或空数组时直接成功，返回空 exposures，此时不校验 user_id、scene 和 request_id；非空数组时
        user_id 必须大于零，scene 必須规范化后非空且最多 32 字节，request_id 最多 64 字节。
      properties:
        user_id: *id001
        scene:
          type: string
        request_id: *id002
        video_ids:
          type: array
          nullable: true
          items:
            type: integer
            format: int64
            minimum: 1
          description: 批内按视频去重，保留首次出现顺序；无批次大小上限。
    RecommendationExposuresResponse:
      type: object
      required:
      - exposures
      properties:
        exposures:
          type: array
          items:
            $ref: '#/components/schemas/ExposureResponse'
    CreateViewEventRequest:
      type: object
      required:
      - video_id
      - scene
      - event_type
      properties:
        video_id:
          type: integer
          format: int64
          minimum: 1
        scene:
          type: string
          description: 去除首尾空白并转为小写后必须非空，UTF-8 字节长度最多 32；不限制为 Feed 查询支持的场景。
        request_id:
          type: string
          description: 可省略；去除首尾空白后 UTF-8 字节长度最多 64。用于关联请求，不是幂等键。
        event_type:
          type: string
          description: 去除首尾空白并转小写后必须为 exposed、play、complete 或 skip。
        watch_ms:
          type: integer
          minimum: 0
          default: 0
        completed:
          type: boolean
          default: false
          description: complete 事件始终保存为 true，其余事件保留传入值。
    ViewEventResponse:
      type: object
      required:
      - video_id
      - scene
      - event_type
      - watch_ms
      - completed
      - id
      - user_id
      - created_at
      properties:
        video_id:
          type: integer
          format: int64
          minimum: 1
        scene:
          type: string
          description: 去除首尾空白并转为小写后必须非空，UTF-8 字节长度最多 32；不限制为 Feed 查询支持的场景。
        request_id:
          type: string
          description: 可省略；去除首尾空白后 UTF-8 字节长度最多 64。用于关联请求，不是幂等键。
        event_type:
          type: string
          enum:
          - exposed
          - play
          - complete
          - skip
        watch_ms:
          type: integer
          minimum: 0
        completed:
          type: boolean
          description: complete 事件始终保存为 true，其余事件保留传入值。
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    ExposureResponse:
      type: object
      required:
      - user_id
      - video_id
      - first_exposed_at
      - last_exposed_at
      - exposure_count
      - last_scene
      properties:
        user_id:
          type: integer
          format: int64
        video_id:
          type: integer
          format: int64
        first_exposed_at:
          type: string
          format: date-time
        last_exposed_at:
          type: string
          format: date-time
        exposure_count:
          type: integer
          minimum: 1
        last_scene:
          type: string
    CreateViewEventResponse:
      type: object
      required:
      - event
      properties:
        event:
          $ref: '#/components/schemas/ViewEventResponse'
        exposure:
          $ref: '#/components/schemas/ExposureResponse'
      description: exposure 仅在 exposed 事件中出现；空 request_id 不输出。
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: healthy
    RegisterRequest:
      type: object
      required:
        - account
        - password
        - nickname
      properties:
        account:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        password:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        nickname:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        password:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in_seconds
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in_seconds:
          type: integer
          format: int64
          example: 900
    UserProfileResponse:
      type: object
      required:
        - id
        - account
        - nickname
        - role
        - bio
        - status
        - avatar_url
        - following_count
        - follower_count
        - work_count
      properties:
        id:
          type: integer
          format: int64
          example: 1
        account:
          type: string
          example: demo_user
        nickname:
          type: string
          example: Demo User
        role:
          type: string
          example: user
        bio:
          type: string
          example: ""
        status:
          type: integer
          example: 1
        avatar_url:
          type: string
          example: ""
        following_count:
          type: integer
          minimum: 0
          example: 0
        follower_count:
          type: integer
          minimum: 0
          example: 0
        work_count:
          type: integer
          minimum: 0
          example: 3
    PublicUserProfileResponse:
      type: object
      required:
        - id
        - nickname
        - bio
        - avatar_url
        - following_count
        - follower_count
        - work_count
      properties:
        id:
          type: integer
          format: int64
          example: 42
        nickname:
          type: string
          example: Demo User
        bio:
          type: string
          example: Video creator
        avatar_url:
          type: string
          example: https://example.com/avatar.png
        following_count:
          type: integer
          minimum: 0
          example: 12
        follower_count:
          type: integer
          minimum: 0
          example: 34
        work_count:
          type: integer
          minimum: 0
          example: 8
    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        avatar_url:
          type: string
        bio:
          type: string
    CreateVideoRequest:
      type: object
      required:
        - title
        - media_url
        - cover_url
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '.*\S.*'
        description:
          type: string
          maxLength: 512
        media_url:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        cover_url:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    VideoResponse:
      type: object
      required:
        - id
        - author_id
        - title
        - description
        - media_url
        - cover_url
        - status
        - like_count
        - comment_count
        - favorite_count
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        author_id:
          type: integer
          format: int64
          example: 7
        title:
          type: string
          example: Demo video
        description:
          type: string
          maxLength: 512
          example: A short introduction to the video.
        media_url:
          type: string
          example: https://example.com/video.mp4
        cover_url:
          type: string
          example: https://example.com/cover.jpg
        status:
          type: integer
          example: 2
        like_count:
          type: integer
          example: 0
        comment_count:
          type: integer
          example: 0
        favorite_count:
          type: integer
          example: 0
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 1
        author_id: 7
        title: Demo video
        description: A short introduction to the video.
        media_url: https://example.com/video.mp4
        cover_url: https://example.com/cover.jpg
        status: 2
        like_count: 0
        comment_count: 0
        favorite_count: 0
        published_at: '2026-08-30T12:00:00Z'
        created_at: '2026-08-30T12:00:00Z'
        updated_at: '2026-08-30T12:00:00Z'
    VideoListResponse:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoResponse'
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
      example:
        items: []
        limit: 20
        offset: 0
    FeedQueryRequest:
      type: object
      properties:
        scene:
          type: string
          description: 支持 timeline、hot、following、recommend；省略或空值使用 timeline，忽略大小写及首尾空白；following 和 recommend 要求有效访问令牌。
        cursor:
          type: string
        limit:
          type: integer
          minimum: 1
          description: 大于 100 时截断为 100；省略时默认 10。
          default: 10
        context:
          type: object
          additionalProperties:
            type: string
    FeedResponse:
      type: object
      required:
        - scene
        - items
        - next_cursor
        - has_more
      properties:
        scene:
          type: string
          example: timeline
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItemResponse'
        next_cursor:
          type: string
          description: URL 安全的 Base64 游标；关注流非空页始终返回游标，包括最后一页。是否继续应以 has_more 为准。
        has_more:
          type: boolean
      example:
        scene: following
        items: []
        next_cursor: ""
        has_more: false
    FeedItemResponse:
      type: object
      required:
        - video_id
        - author_id
        - author_nickname
        - author_avatar_url
        - title
        - description
        - media_url
        - cover_url
        - like_count
        - comment_count
        - favorite_count
        - published_at
      properties:
        video_id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        author_nickname:
          type: string
        author_avatar_url:
          type: string
        title:
          type: string
        description:
          type: string
        media_url:
          type: string
        cover_url:
          type: string
        like_count:
          type: integer
        comment_count:
          type: integer
        favorite_count:
          type: integer
        published_at:
          type: string
          format: date-time
    ActionResponse:
      type: object
      required:
        - video_id
        - action_type
        - active
        - like_count
        - favorite_count
      properties:
        video_id:
          type: integer
          format: int64
        action_type:
          type: string
          enum:
            - LIKE
            - FAVORITE
        active:
          type: boolean
        like_count:
          type: integer
          minimum: 0
        favorite_count:
          type: integer
          minimum: 0
    CreateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '.*\S.*'
    CommentResponse:
      type: object
      required:
        - id
        - video_id
        - user_id
        - user_nickname
        - user_avatar_url
        - content
        - created_at
      properties:
        id:
          type: integer
          format: int64
        video_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        user_nickname:
          type: string
        user_avatar_url:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
    CreateCommentResponse:
      allOf:
        - $ref: '#/components/schemas/CommentResponse'
        - type: object
          required:
            - comment_count
          properties:
            comment_count:
              type: integer
              minimum: 0
    CommentListResponse:
      type: object
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommentResponse'
        next_cursor:
          type: string
        has_more:
          type: boolean
    DeleteCommentResponse:
      type: object
      required:
        - comment_id
        - status
        - comment_count
      properties:
        comment_id:
          type: integer
          format: int64
        status:
          type: integer
        comment_count:
          type: integer
          minimum: 0
    UploadRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
        kind:
          type: string
          enum:
            - video
            - cover
            - avatar
            - file
          default: file
    UploadResponse:
      type: object
      required:
        - url
        - kind
        - filename
        - size
      properties:
        url:
          type: string
        kind:
          type: string
          enum:
            - video
            - cover
            - avatar
            - file
        filename:
          type: string
        size:
          type: integer
          format: int64
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    InvalidFeedRequest:
      description: 分页数量、游标、场景或 JSON 请求体无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: cursor is invalid
    InvalidRequest:
      description: Invalid request body or input fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid request
    PayloadTooLarge:
      description: Uploaded file exceeds the size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: upload too large
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal server error
    Unauthorized:
      description: Authentication is required or the access token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid access token
    UserNotFound:
      description: User was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: user not found
    VideoNotFound:
      description: Video was not found or is not published
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: video not found
    InteractionResourceNotFound:
      description: The requested interaction resource was not found or is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: resource not found
    VideoPermissionDenied:
      description: The current user does not own the video
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: video permission denied
    CommentNotFound:
      description: Comment was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: resource not found
