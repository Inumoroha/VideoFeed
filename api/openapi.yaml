openapi: 3.0.3
info:
  title: Video Feed API
  version: 1.0.0
paths:
  /health:
    get:
      tags:
        - Health
      summary: Get service health status
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: healthy
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              account: demo_user
              password: example-password
              nickname: Demo User
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Demo User
                role: user
                bio: ""
                status: 1
                avatar_url: ""
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: Account already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: account already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/login/password:
    post:
      tags:
        - Authentication
      summary: Log in with account and password
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              account: demo_user
              password: example-password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: example-access-token
                token_type: Bearer
                expires_in_seconds: 900
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid credentials
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out the current user
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful; the client must discard the access token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/me:
    get:
      tags:
        - User
      summary: Get the current user profile
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                id: 1
                account: demo_user
                nickname: Demo User
                role: user
                bio: ""
                status: 1
                avatar_url: ""
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - User
      summary: Update the current user profile
      operationId: updateCurrentUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              nickname: Updated User
              bio: Updated profile
              avatar_url: https://example.com/avatar.png
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos:
    post:
      tags:
        - Video
      summary: Create a published video
      operationId: createVideo
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: Optional key used to safely retry the same create request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoRequest'
            example:
              title: Demo video
              media_url: https://example.com/video.mp4
              cover_url: https://example.com/cover.jpg
      responses:
        '201':
          description: Video created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '200':
          description: Existing video returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/{videoId}:
    parameters:
      - name: videoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Video
      summary: Get a published video
      operationId: getVideo
      security: []
      responses:
        '200':
          description: Published video details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Video
      summary: Delete a video owned by the current user
      operationId: deleteVideo
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Video deleted
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/VideoPermissionDenied'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/users/{userId}/videos:
    get:
      tags:
        - Video
      summary: List published videos by author
      operationId: listVideosByAuthor
      security: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/VideoLimit'
        - $ref: '#/components/parameters/VideoOffset'
      responses:
        '200':
          description: Published videos by the author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/videos/mine:
    get:
      tags:
        - Video
      summary: List the current user's published videos
      operationId: listMyVideos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VideoLimit'
        - $ref: '#/components/parameters/VideoOffset'
      responses:
        '200':
          description: Current user's published videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/feed/time:
    get:
      tags:
        - Feed
      summary: Get the chronological video feed
      operationId: getTimeFeed
      security: []
      parameters:
        - $ref: '#/components/parameters/FeedLimit'
        - $ref: '#/components/parameters/FeedCursor'
      responses:
        '200':
          description: Chronological feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/feed/refresh:
    get:
      tags:
        - Feed
      summary: Refresh the chronological video feed
      operationId: refreshTimeFeed
      security: []
      parameters:
        - $ref: '#/components/parameters/FeedLimit'
      responses:
        '200':
          description: Refreshed feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/feed/view-events:
    post:
      tags:
        - Feed
      summary: Report a video viewing event
      operationId: reportFeedViewEvent
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: Optional key used to safely retry the same event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewEventRequest'
            example:
              visitor_id: visitor-001
              video_id: 3
              event_type: VIEW
              watch_ms: 3000
      responses:
        '201':
          description: Viewing event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewEventResponse'
        '200':
          description: Existing event returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewEventResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    VideoLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
      description: Number of items to return; values above 100 are capped at 100.
    VideoOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    FeedLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
      description: Number of feed items to return; values above 100 are capped at 100.
    FeedCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque server-side cursor returned by the previous feed page. It expires 24 hours after creation; expired or unknown cursors return 400.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: healthy
    RegisterRequest:
      type: object
      required:
        - account
        - password
        - nickname
      properties:
        account:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        password:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        nickname:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        password:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    LoginResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in_seconds
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in_seconds:
          type: integer
          format: int64
          example: 900
    UserProfileResponse:
      type: object
      required:
        - id
        - account
        - nickname
        - role
        - bio
        - status
        - avatar_url
      properties:
        id:
          type: integer
          format: int64
          example: 1
        account:
          type: string
          example: demo_user
        nickname:
          type: string
          example: Demo User
        role:
          type: string
          example: user
        bio:
          type: string
          example: ""
        status:
          type: integer
          example: 1
        avatar_url:
          type: string
          example: ""
    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        avatar_url:
          type: string
        bio:
          type: string
    CreateVideoRequest:
      type: object
      required:
        - title
        - media_url
        - cover_url
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '.*\S.*'
        description:
          type: string
          maxLength: 512
        media_url:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        cover_url:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    VideoResponse:
      type: object
      required:
        - id
        - author_id
        - title
        - description
        - media_url
        - cover_url
        - status
        - like_count
        - comment_count
        - favorite_count
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        author_id:
          type: integer
          format: int64
          example: 7
        title:
          type: string
          example: Demo video
        description:
          type: string
          maxLength: 512
          example: A short introduction to the video.
        media_url:
          type: string
          example: https://example.com/video.mp4
        cover_url:
          type: string
          example: https://example.com/cover.jpg
        status:
          type: integer
          example: 2
        like_count:
          type: integer
          example: 0
        comment_count:
          type: integer
          example: 0
        favorite_count:
          type: integer
          example: 0
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      example:
        id: 1
        author_id: 7
        title: Demo video
        description: A short introduction to the video.
        media_url: https://example.com/video.mp4
        cover_url: https://example.com/cover.jpg
        status: 2
        like_count: 0
        comment_count: 0
        favorite_count: 0
        published_at: '2026-08-30T12:00:00Z'
        created_at: '2026-08-30T12:00:00Z'
        updated_at: '2026-08-30T12:00:00Z'
    VideoListResponse:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoResponse'
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
      example:
        items: []
        limit: 20
        offset: 0
    FeedResponse:
      type: object
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedItemResponse'
        next_cursor:
          type: string
          description: Opaque server-side cursor for the next page; it expires after 24 hours and is empty when there is no next page.
        has_more:
          type: boolean
      example:
        items: []
        next_cursor: ""
        has_more: false
    FeedItemResponse:
      type: object
      required:
        - video_id
        - author_id
        - title
        - description
        - media_url
        - cover_url
        - like_count
        - comment_count
        - favorite_count
        - published_at
      properties:
        video_id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        media_url:
          type: string
        cover_url:
          type: string
        like_count:
          type: integer
        comment_count:
          type: integer
        favorite_count:
          type: integer
        published_at:
          type: string
          format: date-time
    ViewEventRequest:
      type: object
      required:
        - video_id
        - event_type
      properties:
        visitor_id:
          type: string
          maxLength: 128
          description: Required when the request is not associated with a JWT user.
        video_id:
          type: integer
          format: int64
          minimum: 1
        event_type:
          type: string
          description: Event type; accepted values are IMPRESSION, VIEW, or COMPLETE, case-insensitive.
        watch_ms:
          type: integer
          minimum: 0
          default: 0
    ViewEventResponse:
      type: object
      required:
        - id
        - video_id
        - event_type
        - watch_ms
        - created_at
      properties:
        id:
          type: integer
          format: int64
        visitor_id:
          type: string
        video_id:
          type: integer
          format: int64
        event_type:
          type: string
          enum:
            - IMPRESSION
            - VIEW
            - COMPLETE
        watch_ms:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    InvalidRequest:
      description: Invalid request body or input fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid request
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: internal server error
    Unauthorized:
      description: Authentication is required or the access token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: invalid access token
    UserNotFound:
      description: User was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: user not found
    VideoNotFound:
      description: Video was not found or is not published
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: video not found
    VideoPermissionDenied:
      description: The current user does not own the video
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: video permission denied
