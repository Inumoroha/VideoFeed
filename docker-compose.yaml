services:
    postgres:
        image: postgres:17-alpine
        container_name: gcfeed-postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: video_feed_dev
            POSTGRES_DB: video_feed
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d video_feed"]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 20s

    redis:
        image: redis:7.4-alpine
        container_name: gcfeed-redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20

    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        container_name: rabbitmq_container
        environment:
            RABBITMQ_DEFAULT_USER: rabbitmq
            RABBITMQ_DEFAULT_PASS: rabbitmq_password
        ports:
            - "5672:5672"
            - "15672:15672"
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 5s
            timeout: 30s
            retries: 20
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq

    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: gcfeed-api
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        ports:
            - "9000:9000"
        environment:
            DATABASE_URL: postgres://postgres:video_feed_dev@postgres:5432/video_feed?sslmode=disable
            INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
            # 本地开发默认值；部署时可通过环境变量覆盖。
            JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-before-deployment-2026}
        volumes:
            - ./configs/config.docker.yaml:/app/configs/config.yaml:ro
            - api_uploads:/app/uploads
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://127.0.0.1:9000/health >/dev/null",
                ]
            interval: 10s
            timeout: 3s
            retries: 12
            start_period: 20s

    worker:
        build:
            context: .
            dockerfile: Dockerfile
        command: ["./videofeed-worker"]
        restart: on-failure
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        environment:
            DATABASE_URL: postgres://postgres:video_feed_dev@postgres:5432/video_feed?sslmode=disable
            JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-before-deployment-2026}
        volumes:
            - ./configs/config.docker.yaml:/app/configs/config.yaml:ro

    web:
        build:
            context: ./web
            dockerfile: Dockerfile
        container_name: gcfeed-web
        depends_on:
            api:
                condition: service_healthy
        ports:
            - "5173:80"

    prometheus:
        image: prom/prometheus:v3.1.0
        container_name: videofeed-prometheus
        depends_on:
            api:
                condition: service_healthy
        ports:
            - "9090:9090"
        volumes:
            - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"

    grafana:
        image: grafana/grafana:11.4.0
        container_name: videofeed-grafana
        depends_on:
            - prometheus
        ports:
            - "3000:3000"
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
            GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
            GF_PLUGINS_PREINSTALL: ""
        volumes:
            - grafana_data:/var/lib/grafana
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:
    api_uploads:
    prometheus_data:
    grafana_data:
