global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: videofeed-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:9000

  - job_name: videofeed-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9091
